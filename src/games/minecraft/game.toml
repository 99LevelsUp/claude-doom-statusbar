# The Minecraft game: the manifest the game registry (src/games/index.js) reads.
name = "minecraft"
description = "the in-game look: chat, hearts, hunger, XP bar and a 9-slot hotbar"
default_skin = "minecraft"

# What a release before skins saved, and the skins it maps to.
[legacy]
# 0.12.x called this theme "minecraft-hud".
aliases = ["minecraft-hud"]
# One skin only: every preset file name draws it.
reads_presets = false
presets = { minecraft = "minecraft" }

# The npm package of the game's assets, pinned to one version and its npm integrity.
[assets]
package = "@claude-game-bar/minecraft"
version = "1.0.1"
# Empty until 1.0.1 is on npm: the integrity is pinned in a follow-up pull request
# (CONTRIBUTING.md, Asset packages).
integrity = ""
