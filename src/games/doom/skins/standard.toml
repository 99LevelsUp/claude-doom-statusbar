# doom-standard: doom-full without SAVE and SYSTEM. When the terminal is too narrow, the boxes first
# shrink; when that does not fit, the bar switches to doom-minimal.
version = 1
name = "doom-standard"
games = ["doom"]
root = "bar"
smaller = "doom-minimal"

[element.bar]
kind = "row"
separator = " "
children = ["model", "usage", "project", "mugshot", "activity", "agents", "tasks"]

# --- MODEL --------------------------------------------------------------------------------------
[element.model]
kind = "column"
grow = "fill"
frame = { kind = "box", title = "MODEL", background = "#1c2036" }
children = ["model-line", "model-flags", "model-permission", "advisor"]

# The effort icon sits right after the name (no grow: the row does not stretch to the box).
[element.model-line]
kind = "row"
separator = " "
separator_background = "#1c2036"
children = ["model-name", "model-effort"]

[element.model-name]
kind = "text"
metric = "model.name"
icon = "🤖"
width = 10
min_width = 8

[element.model-effort]
kind = "icon"
metric = "model.effort"

[element.model-flags]
kind = "row"
separator = " "
separator_background = "#1c2036"
children = ["model-mode", "model-style"]

# Thinking (💡 on, 👄 off) and fast mode (🏃 on, 🚶 off), as icons only.
[element.model-mode]
kind = "icon"
metric = "model.mode"
sep = " "
width = 5

# The output style: 👷 default, 💁 explanatory, 🙋 learning, 🎨 a style of the user's own.
[element.model-style]
kind = "icon"
metric = "model.style"
other = "🎨"
width = 2

[element.model-permission]
kind = "icon"
metric = "model.permission"
show_text = true
width = 10

[element.advisor]
kind = "text"
metric = "advisor.model"
icon = "🧙"
width = 10
min_width = 6

# --- USAGE --------------------------------------------------------------------------------------
[element.usage]
kind = "column"
grow = "fill"
frame = { kind = "box", title = "USAGE", background = "#1c2036" }
children = ["context", "limit-5h", "limit-7d", "ram", "cost"]

[element.context]
kind = "row"
grow = "fill"
separator = " "
separator_background = "#1c2036"
children = ["context-bar", "context-pct"]

[element.context-bar]
kind = "progress"
metric = "context.hp"
icon = "🧠"
percent = "none"

[element.context-pct]
kind = "number"
metric = "context.hp"
suffix = "%"
color = "threshold"
align = "right"
width = 5

[element.limit-5h]
kind = "row"
grow = "fill"
separator = " "
separator_background = "#1c2036"
children = ["limit-5h-bar", "limit-5h-reset"]

[element.limit-5h-bar]
kind = "progress"
metric = "ratelimit.5h"
icon = "🕔"
percent = "none"

[element.limit-5h-reset]
kind = "text"
metric = "usage.reset5h"
align = "right"
width = 5
min_width = 5

[element.limit-7d]
kind = "row"
grow = "fill"
separator = " "
separator_background = "#1c2036"
children = ["limit-7d-bar", "limit-7d-reset"]

[element.limit-7d-bar]
kind = "progress"
metric = "ratelimit.7d"
icon = "📅"
percent = "none"

[element.limit-7d-reset]
kind = "text"
metric = "usage.reset7d"
align = "right"
width = 5
min_width = 5

[element.ram]
kind = "row"
grow = "fill"
separator = " "
separator_background = "#1c2036"
children = ["ram-bar", "ram-pct"]

[element.ram-bar]
kind = "progress"
metric = "sys.ram"
icon = "💾"
percent = "none"

[element.ram-pct]
kind = "number"
metric = "sys.ram"
suffix = "%"
color = "threshold"
align = "right"
width = 5

[element.cost]
kind = "text"
metric = "cost.total"
icon = "💰"
width = 7
min_width = 5

# --- PROJECT ------------------------------------------------------------------------------------
[element.project]
kind = "column"
grow = "fill"
frame = { kind = "box", title = "PROJECT", background = "#1c2036" }
children = ["session", "cwd", "branch", "work", "churn", "pr"]

[element.session]
kind = "text"
metric = "session.name"
icon = "🎮"
width = 16
min_width = 10

[element.cwd]
kind = "text"
metric = "loc.cwd"
icon = "📁"
width = 16
min_width = 10

[element.branch]
kind = "text"
metric = "git.branch"
icon = "🌿"
width = 16
min_width = 10

[element.work]
kind = "icon"
metric = "git.work"
width = 13

# Lines added in green and removed in red, as "+248 / -209".
[element.churn]
kind = "row"
separator = " / "
separator_background = "#1c2036"
children = ["churn-added", "churn-removed"]

[element.churn-added]
kind = "number"
metric = "loc.added"
icon = "📝"
prefix = "+"
color = "#60c868"
align = "right"
width = 6

[element.churn-removed]
kind = "number"
metric = "loc.removed"
prefix = "-"
color = "#e05440"
width = 5

[element.pr]
kind = "text"
metric = "pr.state"
icon = "⇧ "
width = 8
min_width = 5

# --- the mugshot --------------------------------------------------------------------------------
# DOOM's script picks the face for the session's reaction; without the script (the one-shot status
# line) the idle face is drawn. The terminal's glyph step can only lower `glyphs`.
[element.mugshot]
kind = "animation"
frames = "doom:images/mugshot"
script = "doom:scripts/mugshot.js"
default_frame = "doom:images/mugshot/STFST01.png"
width = 14
rows = 4
glyphs = "octant"
background = "#000000"

# --- ACTIVITY -----------------------------------------------------------------------------------
[element.activity]
kind = "column"
grow = "fill"
frame = { kind = "box", title = "ACTIVITY", background = "#1c2036" }
children = ["geiger", "agent-count", "task-count", "errors"]

[element.geiger]
kind = "sparkline"
metric = "act.geiger"
icon = "📟"
style = "octant"
max = 1
width = 15

[element.agent-count]
kind = "number"
metric = "act.agents"
icon = "👹"
width = 5

[element.task-count]
kind = "text"
metric = "act.tasks"
icon = "🎯"
width = 5
min_width = 5

[element.errors]
kind = "number"
metric = "act.errors"
icon = "💢"
color = "threshold"
width = 5

# --- AGENTS and TASKS ---------------------------------------------------------------------------
# Rows, so the lists fill the bar's whole height; long labels scroll back and forth. An empty list
# leaves only its box's title.
[element.agents]
kind = "row"
when_empty = "shrink"
frame = { kind = "box", title = "AGENTS", background = "#1c2036" }
children = ["agent-list"]

[element.agent-list]
kind = "scroll-list"
metric = "act.subagents"
icon = "👹"
anchor = "top"
width = 19
min_width = 16
rows = 3

[element.tasks]
kind = "row"
when_empty = "shrink"
frame = { kind = "box", title = "TASKS", background = "#1c2036" }
children = ["task-list"]

[element.task-list]
kind = "scroll-list"
metric = "act.tasklist"
anchor = "boundary"
width = 22
min_width = 13
rows = 3
