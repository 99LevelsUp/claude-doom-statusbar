# minecraft — the in-game survival screen instead of boxes:
#   a chat on the left (a looping pre-written script: no tokens), ♥ hearts (5h limit left)
#   + 🍖 hunger (context left), the XP bar (7-day usage, level = its %), and a 9-slot
#   hotbar of session stats.
# Switch themes with:  claude-doom-statusbar theme <name>   (npm run theme <name>)
[bar]
layout = "hotbar"

[hotbar]
hearts = "ratelimit.5h"   # used %, hearts show what is left; empty = "You died!"
hunger = "context.hp"     # used %, shanks show what is left
xp     = "ratelimit.7d"

# The selected slot jumps to what just happened, then wanders on its own when idle.
[hotbar.react]
ouch = "act.errors"       # a tool failed
kill = "loc.added"        # Claude wrote a file
evl  = "act.tasks"        # a task / turn finished

# Nine slots: an item icon and the "stack count" under it. Missing values leave just the item.
[[slot]]
icon = "🪓"
id   = "model.window"           # context window size, e.g. 1M

[[slot]]
icon = "💎"
id   = "cost.total"

[[slot]]
icon = "🌿"
id   = "git.status"             # changed files

[[slot]]
icon = "🧱"
id   = "loc.added"              # lines added this session

[[slot]]
icon = "🐺"
id   = "act.agents"             # running helper agents

[[slot]]
icon = "🏆"
id   = "act.tasks"              # tasks open / done

[[slot]]
icon = "💥"
id   = "act.errors"

[[slot]]
icon = "🔥"
id   = "sys.cpu"

[[slot]]
icon = "🕓"
id   = "sys.clock"
