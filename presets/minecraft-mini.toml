# minecraft-mini — the narrow-terminal fallback for the minecraft theme
[bar]
border_style   = "vertical"
border_color   = "term-bg"
box_background = "#313131"
title_color    = "#ffff55"
headers        = true

[mugshot]
face       = "minecraft"
background = "#5b8731"

[[segment]]
type  = "box"
title = "SURVIVAL"
metric = [
  { id = "model.name",   render = "text",  icon = "🪓", right = "model.effort" },
  { id = "context.hp",   render = "icons", icon = "💖", glyph = "♥", empty_glyph = "♡", stretch = true, gap = 1, invert = true, color = "#ff3b3b", empty_color = "#6a2a2a" },
  { id = "ratelimit.5h", render = "icons", icon = "🍗", glyph = "●", empty_glyph = "○", stretch = true, gap = 1, invert = true, color = "#d08a3a", empty_color = "#5a4a3a" },
  { id = "ratelimit.7d", render = "bar",   icon = "🟢", color = "#80ff20", show_pct = false },
  { id = "cost.total",   render = "number", icon = "💎", color = "#4aedd9" },
]

[[segment]]
type = "mugshot"

[[segment]]
type  = "box"
title = "WORLD"
metric = [
  { id = "loc.cwd",    render = "text",   icon = "🏠" },
  { id = "git.branch", render = "text",   icon = "🌿" },
  { id = "act.agents", render = "number", icon = "🐺" },
  { id = "act.tasks",  render = "number", icon = "🏆" },
  { id = "act.errors", render = "number", icon = "💥", color = "threshold" },
]
