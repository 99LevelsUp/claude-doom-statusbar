# satisfactory-mini — the narrow-terminal fallback for the satisfactory theme
[bar]
border_style   = "vertical"
border_color   = "term-bg"
box_background = "#23262c"
title_color    = "#fa9549"
headers        = true

[mugshot]
face       = "satisfactory"
background = "#14161a"

[[segment]]
type  = "box"
title = "POWER GRID"
metric = [
  { id = "model.name",   render = "text",   icon = "🦺", right = "model.effort" },
  { id = "ratelimit.5h", render = "bar",    icon = "🔌", color = [[0, "#38d6f0"], [70, "#e8d040"], [100, "#ff3b30"]], show_pct = false },
  { id = "ratelimit.7d", render = "icons",  icon = "🔋", glyph = "▰", empty_glyph = "▱", count = 8, invert = true, color = "#38d6f0", empty_color = "#4a4f58" },
  { id = "context.hp",   render = "bar",    icon = "🎒", color = "threshold" },
  { id = "cost.total",   render = "number", icon = "🪙", color = "#fa9549" },
]

[[segment]]
type = "mugshot"

[[segment]]
type  = "box"
title = "FACTORY"
metric = [
  { id = "loc.cwd",    render = "text",   icon = "🏭" },
  { id = "git.branch", render = "text",   icon = "🚂" },
  { id = "act.agents", render = "number", icon = "🛸" },
  { id = "act.tasks",  render = "number", icon = "🏁" },
  { id = "act.errors", render = "number", icon = "🚨", color = "threshold" },
]
