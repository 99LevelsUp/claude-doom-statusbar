name: One-shot face cost

# Measures what the one-shot status line costs on Linux and macOS (no render daemon there) at the
# richest glyph step, with the face converted and with it read from the disk cache. Runs when the
# converter or the measurement changes, and by hand.

on:
  workflow_dispatch:
  push:
    paths:
      - src/glyphs.js
      - src/glyph-render.js
      - src/png.js
      - src/face.js
      - scripts/measure-oneshot.mjs
      - .github/workflows/oneshot-cost.yml

permissions:
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Measure
        run: node scripts/measure-oneshot.mjs 21
