name: One-shot face cost

# Measures what a status line tick costs on Linux and macOS: the one-shot renderer at the richest
# glyph step (face converted, then read from the disk cache), and the bash client against a
# running render daemon where a bash 5 is found. Runs when the converter, the client path or the
# measurement changes, and by hand.

on:
  workflow_dispatch:
  push:
    paths:
      - src/kit/raster/glyphs.js
      - src/kit/raster/glyph-render.js
      - src/kit/raster/png.js
      - src/games/doom/face.js
      - scripts/measure-oneshot.mjs
      - scripts/measure-client.mjs
      - src/doombar-client.sh
      - src/daemon.js
      - .github/workflows/oneshot-cost.yml

permissions:
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Measure
        run: node scripts/measure-oneshot.mjs 21

      - name: Measure the bash client
        run: node scripts/measure-client.mjs 21
