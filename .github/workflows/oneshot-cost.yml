name: One-shot face cost

# Measures what drawing the mugshot costs the one-shot status line on Linux and macOS (no render
# daemon there), built-in converter against chafa, at the richest glyph step. Runs when the
# converter or the measurement changes, and by hand.

on:
  workflow_dispatch:
  push:
    paths:
      - src/glyphs.js
      - src/glyph-render.js
      - src/face.js
      - scripts/measure-oneshot.mjs
      - .github/workflows/oneshot-cost.yml

permissions:
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Homebrew is preinstalled on the Linux runners too, and does not depend on the Ubuntu archive
      # mirrors, which have failed to resolve on these runners.
      - name: Install chafa (Linux)
        if: runner.os == 'Linux'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install chafa
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Install chafa (macOS)
        if: runner.os == 'macOS'
        run: brew install chafa

      - name: Install dependencies
        run: npm ci

      - name: Measure
        run: node scripts/measure-oneshot.mjs 21
